<section class="DemoTabs">
  <nav mat-tab-nav-bar>
    <a
      mat-tab-link
      *ngFor="let tab of tabs"
      [routerLink]="tab.route"
      routerLinkActive
      #rla="routerLinkActive"
      [active]="rla.isActive"
    >
      {{ tab.label }}
    </a>
  </nav>

  <div class="DemoTabs__content">
    <router-outlet></router-outlet>
  </div>
</section>
